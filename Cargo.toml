[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["celet-ff-io"]
edition = "2024"
# License intentionally left EMPTY for now (principal, 2026-11-09):
# the single value lives HERE; member crates reference it via
# `license.workspace = true`. Fill this in once the licensing
# decision lands — never set a license on members directly.
license = ""
publish = false
rust-version = "1.98"

[workspace.dependencies]
# --- LPZ106 protocol-products crates (path deps; LPZ106 is READ-ONLY) ---
protobuf-varint-deframer = { path = "../../../lpz106/code/zconn/crates/protobuf-varint-deframer" }
zconned-stdio-types = { path = "../../../lpz106/code/zconn/crates/zconned-stdio-types" }
zconned-material = { path = "../../../lpz106/code/zconn/crates/zconned-material" }
zconned-io-link = { path = "../../../lpz106/code/zconn/crates/zconned-io-link" }

# --- TUI stack (decided: ratatui + crossterm) ---
ratatui = "0.30.2"

# --- concurrency model C2 (producer threads + single channel) ---
crossbeam-channel = "0.5.17"

# --- house style (inherited from LPZ106 rules C+) ---
tap = "1.0.1"
thiserror = "2.0.21"
miette = { version = "7.6.0", features = ["fancy"] }
typed-builder = "0.23.2"
getset = "0.1.7"
log = "0.4.35"
env_logger = "0.11.11"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
