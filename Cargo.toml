[workspace]
members = ["crates/*"]
# The linked zconn tree is INSIDE the root dir; without the exclude,
# cargo claims those path deps for THIS workspace (lexical path
# membership) and their `workspace = true` inheritance breaks.
exclude = ["local-deps"]
resolver = "3"

[workspace.package]
authors = ["celet-ff-io"]
edition = "2024"
# The single license value lives HERE (principal, 2026-11-10: mimic
# zconn verbatim — MIT OR Apache-2.0 with both LICENSE files);
# member crates reference it via `license.workspace = true` — never
# set a license on members directly.
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.98"

[workspace.dependencies]
# --- zconn workspace crates, consumed as path deps from a separate
# local checkout (that checkout is READ-ONLY for this repo) ---
# Note: zconned-io-link (the async/tokio adapter in that workspace)
# is deliberately NOT consumed — the event loop runs no async
# runtime; the reader threads use the SYNC deframer state machine
# directly.
# The paths go through the gitignored `local-deps/` directory: a
# symlink to a zconn checkout AT WHATEVER LOCATION THE MACHINE KEEPS
# IT — every machine's project layout differs, and this one link is
# the only per-machine adaptation (the manifests stay
# machine-independent). The link targets the WHOLE zconn tree, not
# per-crate copies: cargo resolves a dep's workspace inheritance by
# walking up the LINK path, so a bare crate link would fall into THIS
# workspace; the whole tree keeps zconn's own root workspace in the
# walk. After a fresh clone, recreate it (point the link at the
# zconn checkout THIS machine keeps):
#   mkdir -p local-deps && \
#     ln -s /path/to/zconn local-deps/zconn
protobuf-varint-deframer = { path = "local-deps/zconn/crates/protobuf-varint-deframer" }
zconned-stdio-types = { path = "local-deps/zconn/crates/zconned-stdio-types" }
zconned-material = { path = "local-deps/zconn/crates/zconned-material" }
zconned-crypto = { path = "local-deps/zconn/crates/zconned-crypto" }

# --- wire + link glue ---
prost = "0.14.4"
base64 = "0.22.1"
pbjson-types = "0.9.0"
prost-types = "0.14.4"
bytes = "1.12.1"
shlex = "2.0.1"

# --- timestamps on the UI surface ---
jiff = "0.2.41"

# --- XDG resolution (nvim-mirrored layout) ---
dirs = "7.0.0"

# --- off-the-shelf input component (principal: prefer existing ones) ---
tui-input = "0.15.5"

# --- TUI stack (decided: ratatui + crossterm) ---
ratatui = "0.30.2"

# --- single-channel producer/consumer model (producer threads + one channel) ---
crossbeam-channel = "0.5.17"

# --- workspace house style ---
tap = "1.0.1"
thiserror = "2.0.21"
miette = { version = "7.6.0", features = ["fancy"] }
typed-builder = "0.23.2"
getset = "0.1.7"
log = "0.4.35"
env_logger = "0.11.11"
clap = { version = "4.6.7", features = ["derive"] }
clap-verbosity-flag = "3.0.4"
